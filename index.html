
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jameer 3D Racing</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
 background:#07111d;
 color:white;
 font-family:Arial,sans-serif;
 display:flex;
 justify-content:center;
 align-items:center;
 min-height:100vh;
 padding:12px;
}

.game{
 width:100%;
 max-width:500px;
 background:#101e30;
 border:2px solid #29435d;
 border-radius:20px;
 overflow:hidden;
 box-shadow:0 0 35px #00c8ff30;
}

header{
 text-align:center;
 padding:15px;
 background:linear-gradient(120deg,#102b46,#17213b);
}

header h1{
 color:#20dcff;
 font-size:25px;
 letter-spacing:2px;
}

header p{
 color:#aabbd0;
 font-size:12px;
 margin-top:5px;
}

.scorebar{
 display:flex;
 justify-content:space-around;
 padding:12px;
 background:#17283e;
 font-weight:bold;
}

.scorebar span{color:#21e4ff}

canvas{
 display:block;
 width:100%;
 background:#4c9d55;
}

.controls{
 padding:15px;
 display:flex;
 justify-content:space-around;
 background:#14243a;
}

.controls button{
 width:90px;
 height:55px;
 border:1px solid #20cfff;
 border-radius:13px;
 background:#1b3956;
 color:white;
 font-size:25px;
 cursor:pointer;
 touch-action:none;
}

.controls button:active{
 background:#087da6;
}

#start{
 display:block;
 width:90%;
 margin:15px auto;
 padding:14px;
 border:0;
 border-radius:12px;
 background:linear-gradient(90deg,#00a9ff,#6952ef);
 color:white;
 font-size:17px;
 font-weight:bold;
 cursor:pointer;
}

footer{
 text-align:center;
 padding:10px;
 font-size:11px;
 color:#8ba3bb;
}
</style>
</head>

<body>

<div class="game">

<header>
<h1>🏎️ JAMEER RACING</h1>
<p>ULTIMATE HIGHWAY CHALLENGE</p>
</header>

<div class="scorebar">
<div>SCORE: <span id="score">0</span></div>
<div>COINS: <span id="coins">0</span></div>
<div>BEST: <span id="best">0</span></div>
</div>

<canvas id="gameCanvas" width="400" height="600"></canvas>

<button id="start">▶ START RACE</button>

<div class="controls">
<button id="left">⬅</button>
<button id="right">➡</button>
</div>

<footer>
Avoid traffic • Collect coins • Beat your record
</footer>

</div>

<script>
const canvas=document.getElementById("gameCanvas");
const ctx=canvas.getContext("2d");

const scoreEl=document.getElementById("score");
const coinsEl=document.getElementById("coins");
const bestEl=document.getElementById("best");
const startBtn=document.getElementById("start");

let running=false;
let score=0;
let coins=0;
let speed=5;
let roadMove=0;
let spawnTimer=0;
let coinTimer=0;
let lastTime=0;
let playerLane=1;
let obstacles=[];
let coinItems=[];

let best=0;

try{
 best=Number(localStorage.getItem("jameerBest"))||0;
}catch(e){}

bestEl.textContent=best;

const lanes=[105,200,295];

const player={
 x:200,
 y:490,
 width:43,
 height:75
};

function drawRoad(){

 // Sky
 let sky=ctx.createLinearGradient(0,0,0,600);
 sky.addColorStop(0,"#65c9ec");
 sky.addColorStop(1,"#d5eaff");
 ctx.fillStyle=sky;
 ctx.fillRect(0,0,400,600);

 // Grass
 ctx.fillStyle="#287b40";
 ctx.fillRect(0,0,400,600);

 // Road
 ctx.fillStyle="#30343b";
 ctx.beginPath();
 ctx.moveTo(125,0);
 ctx.lineTo(275,0);
 ctx.lineTo(390,600);
 ctx.lineTo(10,600);
 ctx.closePath();
 ctx.fill();

 // Road borders
 ctx.strokeStyle="#ffffff";
 ctx.lineWidth=5;
 ctx.beginPath();
 ctx.moveTo(125,0);
 ctx.lineTo(10,600);
 ctx.moveTo(275,0);
 ctx.lineTo(390,600);
 ctx.stroke();

 // Road lane markings
 ctx.strokeStyle="#f9e9a5";
 ctx.lineWidth=4;
 ctx.setLineDash([35,35]);

 let offset=roadMove%70;

 ctx.beginPath();
 ctx.moveTo(175,offset-70);
 ctx.lineTo(135,600);
 ctx.moveTo(225,offset-70);
 ctx.lineTo(265,600);
 ctx.stroke();

 ctx.setLineDash([]);

 // Roadside trees
 for(let i=0;i<9;i++){
  let y=(i*90+roadMove*1.5)%650-50;
  let x1=35-y*.12;
  let x2=365+y*.12;

  drawTree(x1,y);
  drawTree(x2,y);
 }
}

function drawTree(x,y){
 ctx.fillStyle="#603c20";
 ctx.fillRect(x-5,y+10,10,25);

 ctx.fillStyle="#0a6c34";
 ctx.beginPath();
 ctx.arc(x,y,17,0,Math.PI*2);
 ctx.fill();

 ctx.fillStyle="#20a64c";
 ctx.beginPath();
 ctx.arc(x-6,y-7,10,0,Math.PI*2);
 ctx.fill();
}

function drawCar(x,y,color,scale=1){

 ctx.save();
 ctx.translate(x,y);
 ctx.scale(scale,scale);

 // Shadow
 ctx.fillStyle="#0008";
 ctx.beginPath();
 ctx.ellipse(0,34,28,9,0,0,Math.PI*2);
 ctx.fill();

 // Wheels
 ctx.fillStyle="#111";
 ctx.fillRect(-25,-20,9,25);
 ctx.fillRect(16,-20,9,25);
 ctx.fillRect(-25,18,9,22);
 ctx.fillRect(16,18,9,22);

 // Car body
 let grad=ctx.createLinearGradient(-20,0,20,0);
 grad.addColorStop(0,"#a90000");
 grad.addColorStop(.5,color);
 grad.addColorStop(1,"#650000");

 ctx.fillStyle=grad;
 ctx.beginPath();
 ctx.moveTo(-19,32);
 ctx.lineTo(-23,12);
 ctx.lineTo(-18,-28);
 ctx.lineTo(-11,-37);
 ctx.lineTo(11,-37);
 ctx.lineTo(18,-28);
 ctx.lineTo(23,12);
 ctx.lineTo(19,32);
 ctx.closePath();
 ctx.fill();

 // Windows
 ctx.fillStyle="#132c42";
 ctx.beginPath();
 ctx.moveTo(-13,-18);
 ctx.lineTo(-9,-32);
 ctx.lineTo(9,-32);
 ctx.lineTo(13,-18);
 ctx.closePath();
 ctx.fill();

 ctx.fillStyle="#68bde0";
 ctx.fillRect(-12,3,24,12);

 // Headlights
 ctx.fillStyle="#fff7b0";
 ctx.fillRect(-17,25,9,5);
 ctx.fillRect(8,25,9,5);

 ctx.restore();
}

function drawCoin(c){

 ctx.fillStyle="#d88b00";
 ctx.beginPath();
 ctx.arc(c.x,c.y,13,0,Math.PI*2);
 ctx.fill();

 ctx.strokeStyle="#fff16b";
 ctx.lineWidth=4;
 ctx.beginPath();
 ctx.arc(c.x,c.y,9,0,Math.PI*2);
 ctx.stroke();

 ctx.fillStyle="#fff";
 ctx.font="bold 14px Arial";
 ctx.textAlign="center";
 ctx.fillText("$",c.x,c.y+5);
}

function drawScene(){

 drawRoad();

 coinItems.forEach(drawCoin);

 obstacles.forEach(o=>{
  drawCar(o.x,o.y,o.color,o.scale);
 });

 drawCar(player.x,player.y,"#08cfff",1);
}

function movePlayer(dir){
 if(!running)return;

 playerLane+=dir;
 playerLane=Math.max(0,Math.min(2,playerLane));

 player.x=lanes[playerLane];
}

function spawnObstacle(){

 let lane=Math.floor(Math.random()*3);

 obstacles.push({
  x:lanes[lane],
  y:-80,
  color:["#ff3434","#ffae00","#a54dff","#e8e8e8"][Math.floor(Math.random()*4)],
  scale:.85
 });
}

function spawnCoin(){

 let lane=Math.floor(Math.random()*3);

 coinItems.push({
  x:lanes[lane],
  y:-20
 });
}

function collision(a,b){

 return Math.abs(a.x-b.x)<34 &&
        Math.abs(a.y-b.y)<58;
}

function gameOver(){

 running=false;
 startBtn.textContent="🔄 PLAY AGAIN";

 if(score>best){
  best=score;
  bestEl.textContent=best;
  try{
   localStorage.setItem("jameerBest",best);
  }catch(e){}
 }

 ctx.fillStyle="#000a";
 ctx.fillRect(0,0,400,600);

 ctx.textAlign="center";
 ctx.fillStyle="#fff";
 ctx.font="bold 35px Arial";
 ctx.fillText("GAME OVER",200,260);

 ctx.font="bold 22px Arial";
 ctx.fillStyle="#20dcff";
 ctx.fillText("Score: "+score,200,310);

 ctx.font="18px Arial";
 ctx.fillStyle="white";
 ctx.fillText("Press PLAY AGAIN",200,355);
}

function update(dt){

 let factor=Math.min(dt/16.67,2);

 roadMove+=speed*factor;

 spawnTimer+=dt;
 coinTimer+=dt;

 if(spawnTimer>Math.max(420,1000-speed*45)){
  spawnObstacle();
  spawnTimer=0;
 }

 if(coinTimer>1500){
  spawnCoin();
  coinTimer=0;
 }

 obstacles.forEach(o=>{
  o.y+=speed*factor;

  if(collision(player,o)){
   gameOver();
  }
 });

 coinItems.forEach(c=>{
  c.y+=speed*factor;

  if(collision(player,c)){
   c.collected=true;
   coins++;
   score+=10;
   coinsEl.textContent=coins;
  }
 });

 obstacles=obstacles.filter(o=>o.y<700);
 coinItems=coinItems.filter(c=>c.y<700&&!c.collected);

 score+=Math.floor(factor);
 scoreEl.textContent=score;

 speed=Math.min(5+score/400,12);
}

function loop(time){

 let dt=Math.min(time-lastTime,40);
 lastTime=time;

 if(running){
  update(dt);
 }

 drawScene();

 requestAnimationFrame(loop);
}

function startGame(){

 score=0;
 coins=0;
 speed=5;
 roadMove=0;
 spawnTimer=0;
 coinTimer=0;
 playerLane=1;
 player.x=lanes[1];

 obstacles=[];
 coinItems=[];

 scoreEl.textContent=0;
 coinsEl.textContent=0;

 running=true;
 lastTime=performance.now();

 startBtn.textContent="🏁 RACING...";
}

startBtn.addEventListener("click",()=>{
 if(!running)startGame();
});

document.addEventListener("keydown",e=>{

 if(e.key==="ArrowLeft"||e.key==="a"){
  movePlayer(-1);
 }

 if(e.key==="ArrowRight"||e.key==="d"){
  movePlayer(1);
 }

});

document.getElementById("left").addEventListener("pointerdown",()=>{
 movePlayer(-1);
});

document.getElementById("right").addEventListener("pointerdown",()=>{
 movePlayer(1);
});

requestAnimationFrame(loop);

</script>

</body>
  </html>
